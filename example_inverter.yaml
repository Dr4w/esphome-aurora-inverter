    #         payload: !lambda 'return to_string(x).c_str();'

  - platform: aurora_monitor
    name: "Energy This Week"
    aurora_monitor_id: inverter_monitor
    energy_type: CURRENT_WEEK
    unit_of_measurement: "Wh"
    accuracy_decimals: 0
    # on_value:
    #   then:
    #     - mqtt.publish:
    #         topic: "emon/aurora/current_week"
    #         payload: !lambda 'return to_string(x).c_str();'

  - platform: aurora_monitor
    name: "Energy This Month"
    aurora_monitor_id: inverter_monitor
    energy_type: CURRENT_MONTH
    unit_of_measurement: "Wh"
    accuracy_decimals: 0
    # on_value:
    #   then:
    #     - mqtt.publish:
    #         topic: "emon/aurora/current_month"
    #         payload: !lambda 'return to_string(x).c_str();'

  - platform: aurora_monitor
    name: "Energy This Year"
    aurora_monitor_id: inverter_monitor
    energy_type: CURRENT_YEAR
    unit_of_measurement: "Wh"
    accuracy_decimals: 0
    # on_value:
    #   then:
    #     - mqtt.publish:
    #         topic: "emon/aurora/current_year"
    #         payload: !lambda 'return to_string(x).c_str();'

  - platform: aurora_monitor
    name: "Energy Total"
    aurora_monitor_id: inverter_monitor
    energy_type: TOTAL
    unit_of_measurement: "Wh"
    accuracy_decimals: 0
    # on_value:
    #   then:
    #     - mqtt.publish:
    #         topic: "emon/aurora/total"
    #         payload: !lambda 'return to_string(x).c_str();'

# 4) Text sensors for status/info
text_sensor:
  - platform: aurora_monitor
    name: "Inverter Connection"
    aurora_monitor_id: inverter_monitor
    info_type: CONNECTION_STATUS

  - platform: aurora_monitor
    name: "System Part Number"
    aurora_monitor_id: inverter_monitor
    info_type: SYSTEM_PN

  - platform: aurora_monitor
    name: "Serial Number"
    aurora_monitor_id: inverter_monitor
    info_type: SYSTEM_SERIAL_NUMBER

  - platform: aurora_monitor
    name: "Firmware Release"
    aurora_monitor_id: inverter_monitor
    info_type: FIRMWARE_RELEASE


